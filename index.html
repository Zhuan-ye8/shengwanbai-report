<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>北京升万百会计师事务所报告查询页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            background: linear-gradient(135deg, #0a3d8f 0%, #1a6bc4 40%, #2980d9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 520px;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #0d47a1, #1565c0);
            padding: 32px 28px 36px;
            text-align: center;
            position: relative;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -1px; left: 0; right: 0;
            height: 40px;
            background: #fff;
            border-radius: 40px 40px 0 0;
        }
        .header h1 {
            font-size: 20px; color: #fff; letter-spacing: 2px; margin: 0;
        }
        .header .sub {
            font-size: 13px; color: rgba(255,255,255,0.75); margin-top: 6px;
        }
        .content { padding: 20px 30px 30px; }
        .row {
            display: flex; align-items: flex-start;
            padding: 14px 0; border-bottom: 1px solid #f0f2f5;
        }
        .row:first-child { padding-top: 6px; }
        .row:last-of-type { border-bottom: none; }
        .label {
            width: 90px; flex-shrink: 0;
            font-size: 13px; color: #8898aa; font-weight: 500; padding-top: 2px;
        }
        .val {
            flex: 1; font-size: 15px; color: #1a2332; font-weight: 500; line-height: 1.6;
        }
        .val .hl { color: #1565c0; font-weight: 600; }
        .cpa-item { font-size: 15px; color: #1a2332; font-weight: 500; }
        .cpa-item .nm { color: #1565c0; font-weight: 600; }
        .cpa-item .cd { font-weight: 400; color: #5a6a7a; font-size: 13px; }
        .qr-wrap {
            display: flex; justify-content: center;
            padding: 24px 0 10px;
        }
        .qr-box {
            width: 170px; height: 170px;
            background: #fff;
            border: 2px solid #1565c0;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }
        .qr-hint { text-align: center; font-size: 12px; color: #b0bec5; margin-top: 4px; }
        .rid {
            background: #f8fafc; border-radius: 8px;
            padding: 12px 16px; margin-top: 8px;
            display: flex; align-items: center; gap: 8px;
        }
        .rid .rl { font-size: 12px; color: #8898aa; white-space: nowrap; }
        .rid .rv { font-size: 14px; color: #1a2332; font-weight: 500; font-family: "Courier New", monospace; }
        .footer {
            background: #f8fafc; padding: 16px 30px;
            text-align: center; border-top: 1px solid #eef1f5;
        }
        .footer p { font-size: 12px; color: #a0aeb8; letter-spacing: 0.5px; }
        @media (max-width: 420px) {
            .header h1 { font-size: 17px; }
            .content { padding: 10px 20px 24px; }
            .label { width: 78px; font-size: 12px; }
            .val { font-size: 14px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>报告查询页</h1>
        <div class="sub">北京升万百会计师事务所</div>
    </div>
    <div class="content">
        <div class="row">
            <div class="label">报告标题</div>

        </div>
        <div class="row">

        </div>
        <div class="row">
            <div class="label">公司名称</div>
            <div class="val">中国神华能源股份有限公司神东煤炭分公司</div>
        </div>
        <div class="row">
            <div class="label">签字注册会计师</div>
            <div class="val">
                <div class="cpa-item"><span class="nm">李慎举</span><span class="cd">(230000057262)</span></div>
                <div class="cpa-item"><span class="nm">项妍</span><span class="cd">(110101309933)</span></div>
            </div>
        </div>
        <div class="row">

        <div class="rid">

            <span class="rv">2025122965923654</span>

</div>
</body>
</html>
